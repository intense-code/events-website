<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Locations Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet (no API key required) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    :root { --bg: #2f6c81; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: #fff;
      display: grid;
      grid-template-columns: 360px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "header header"
        "sidebar map";
      /* height: 100vh; */
    }

    header {
      grid-area: header;
      display: flex;
      padding: 1rem;
      background: var(--bg);
      border-bottom: 1px solid rgba(255,255,255,.15);
    }

    .sidebar {
      grid-area: sidebar;
      background: #0f2730;
      border-right: 1px solid rgba(255,255,255,.12);
      overflow: auto;
      padding: 1rem;
    }

    .search {
      display: flex;
      gap: .5rem;
      margin-bottom: .75rem;
    }
    .search input {
      flex: 1;
      padding: .6rem .8rem;
      border-radius: .6rem;
      border: none;
      outline: none;
    }
    .search button {
      padding: .6rem .9rem;
      border-radius: .6rem;
      border: none;
      background: #1fd4e6;
      color: #052a2f;
      font-weight: 700;
      cursor: pointer;
    }

    .list {
      display: grid;
      gap: .6rem;
    }
    .card {
      background: #123845;
      border-radius: .8rem;
      padding: .75rem .9rem;
      transition: transform .15s ease, box-shadow .15s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
    }
    .card h3 {
      margin: 0 0 .25rem 0;
      font-size: 1rem;
    }
    .card p {
      margin: 0;
      color: #cfe7ef;
      font-size: .9rem;
      line-height: 1.35;
    }
    .pill {
      display: inline-block;
      font-size: .75rem;
      padding: .15rem .5rem;
      border-radius: 999px;
      margin-top: .35rem;
      background: #1fd4e6; color: #052a2f; font-weight: 700;
    }

    #map {
      grid-area: map;
      height: 100%;
      width: 100%;
    }

    @media (max-width: 860px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 40vh 1fr;
        grid-template-areas:
          "header"
          "map"
          "sidebar";
      }
      .sidebar { border-right: 0; border-top: 1px solid rgba(255,255,255,.12); }
    }
  </style>
</head>
<body>
  
   <header class="hero">
    <div class="hero__img-wrap">
      <img src="EventCenter1.png" alt="Events R’ Us banner"/>
    </div>
    <nav class="cards-container" aria-label="Primary">
      <a href="index.html">
        <div class="card-slot">
        <div class="card red">
        <h1>Home</h1>
        <ul class="menu">
          <li>Banner</li>
          <li>About Us</li>
          <li>Welcome</li>
          <li>Featured</li>
        </ul>
      </div>
      </div>
      </a>

      <a href="events.html">
        <div class="card-slot">
        <div class="card blue">
        <h1>Events</h1>
        <ul class="menu">
          <li>Name</li>
          <li>Date</li>
          <li>Description</li>
        </ul>
      </div>
      </div>
      </a>

      <a href="menu.html">
        <div class="card-slot">
        <div class="card blue">
        <h1>Menu</h1>
        <ul class="menu">
          <li>Appetizers</li>
          <li>Mains</li>
          <li>Dessert</li>
          <li>Beverages</li>
        </ul>
      </div>
      </div>
      </a>

      <a href="loc.html">
        <div class="card-slot">
        <div class="card yellow">
        <h1>Location</h1>
        <ul class="menu">
          <li>Address</li>
          <li>Hours</li>
          <li>Map</li>
        </ul>
      </div>
      </div>
      </a>

      <a href="contactus.html">
        <div class="card-slot">
        <div class="card red">
        <h1>Contact Us</h1>
        <ul class="menu">
          <li>Name</li>
          <li>Email</li>
          <li>Message</li>
        </ul>
      </div>
      </div>
      </a>
    </nav>
  </header>
  

  <aside class="sidebar" aria-label="Location list">
    <div class="search">
      <input id="q" type="search" placeholder="Search by name or city…" />
      <button id="clear">Clear</button>
    </div>
    <div id="list" class="list" role="list"></div>
  </aside>

  <div id="map" role="region" aria-label="Map"></div>

  <script>
    // === 1) Replace with your real API endpoint ==========================
    const API_URL = "http://127.0.0.1:5500/Assignments/events-website/";
    // Expected response:
    // [
    //   { "id": 1, "name": "Event Center", "address": "244 Ponderosa Ave, Apple Valley, CA",
    //     "city": "Apple Valley", "lat": 34.5382, "lng": -117.2168, "category": "Venue",
    //     "description": "Main hall for concerts and fairs." }
    // ]

    // === 2) Fallback demo data if API is unavailable =====================
    const demoData = [
      {
        id: 1,
        name: "Events R’ Us — Main Hall",
        address: "244 Ponderosa Ave, Apple Valley, CA 92307",
        city: "Apple Valley",
        lat: 34.5382,
        lng: -117.2168,
        category: "Venue",
        description: "Our primary venue for concerts, expos, and community events."
      },
      {
        id: 2,
        name: "Old Town Plaza",
        address: "77 Commerce Way, Apple Valley, CA 92307",
        city: "Apple Valley",
        lat: 34.5116,
        lng: -117.1853,
        category: "Plaza",
        description: "Food Truck Fridays and outdoor markets."
      },
      {
        id: 3,
        name: "Central Park",
        address: "555 Main St, Victorville, CA 92395",
        city: "Victorville",
        lat: 34.5361,
        lng: -117.2912,
        category: "Park",
        description: "Outdoor movie nights under the stars."
      },
      {
        id: 4,
        name: "Riverside Music Lane",
        address: "900 Music Lane, Riverside, CA 92501",
        city: "Riverside",
        lat: 33.9846,
        lng: -117.3755,
        category: "Venue",
        description: "Jazz evenings & seasonal festivals."
      }
    ];

    // === 3) Map setup (Leaflet + OSM) ====================================
    const map = L.map("map", {
      center: [34.5382, -117.2168],
      zoom: 11,
      scrollWheelZoom: true
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
    }).addTo(map);

    const markersById = new Map();

    // === 4) Fetch locations =================================================
    async function loadLocations() {
      try {
        const res = await fetch(API_URL, { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error("API returned " + res.status);
        const data = await res.json();
        return Array.isArray(data) ? data : demoData;
      } catch (err) {
        console.warn("Using demo data (API not available):", err.message);
        return demoData;
      }
    }

    // === 5) Render list + markers ==========================================
    function renderList(listEl, locations) {
      listEl.innerHTML = "";
      locations.forEach(loc => {
        const item = document.createElement("button");
        item.className = "card";
        item.setAttribute("role", "listitem");
        item.innerHTML = `
          <h3>${escapeHtml(loc.name)}</h3>
          <p>${escapeHtml(loc.address)}</p>
          <span class="pill">${escapeHtml(loc.category || "Location")}</span>
        `;
        item.addEventListener("click", () => focusLocation(loc.id));
        listEl.appendChild(item);
      });
    }

    function renderMarkers(locations) {
      markersById.clear();
      const bounds = [];
      locations.forEach(loc => {
        if (typeof loc.lat !== "number" || typeof loc.lng !== "number") return;
        const marker = L.marker([loc.lat, loc.lng]).addTo(map);
        marker.bindPopup(`
          <strong>${escapeHtml(loc.name)}</strong><br/>
          ${escapeHtml(loc.address)}<br/>
          <em>${escapeHtml(loc.description || "")}</em>
        `);
        markersById.set(loc.id, marker);
        bounds.push([loc.lat, loc.lng]);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
    }

    function focusLocation(id) {
      const marker = markersById.get(id);
      if (!marker) return;
      map.setView(marker.getLatLng(), Math.max(map.getZoom(), 14), { animate: true });
      marker.openPopup();
    }

    // === 6) Search/filter ===================================================
    function filterLocations(q, source) {
      const s = q.trim().toLowerCase();
      if (!s) return source;
      return source.filter(loc =>
        (loc.name || "").toLowerCase().includes(s) ||
        (loc.city || "").toLowerCase().includes(s) ||
        (loc.address || "").toLowerCase().includes(s) ||
        (loc.category || "").toLowerCase().includes(s)
      );
    }

    // === 7) Init ============================================================
    let allLocations = [];
    const listEl = document.getElementById("list");
    const qEl = document.getElementById("q");
    const clearBtn = document.getElementById("clear");

    (async () => {
      allLocations = await loadLocations();
      renderList(listEl, allLocations);
      renderMarkers(allLocations);
    })();

    qEl.addEventListener("input", () => {
      const filtered = filterLocations(qEl.value, allLocations);
      renderList(listEl, filtered);
      renderMarkers(filtered);
    });
    clearBtn.addEventListener("click", () => {
      qEl.value = "";
      renderList(listEl, allLocations);
      renderMarkers(allLocations);
    });

    // === 8) Small helpers ===================================================
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[s]));
    }
  </script>
</body>
</html>
