<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Locations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <style>
    :root { --bg: #2f6c81; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: #fff;
    }

    /* Hero + navbar cards (same as before) */
    .hero__img-wrap { display: flex; justify-content: center; padding: 1.5rem 0; }
    .hero__img-wrap img { width: min(60%, 680px); height: 20vh; object-fit: cover; }
    .cards-container { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; background: var(--bg); padding: 1rem 1rem 2rem; }
    .card { width: 15rem; height: 4rem; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; transition: transform 0.22s; padding-top: 0.75rem; }
    .card h1 { font-size: 1.4rem; margin: 0; text-align: center; }
    .card-slot { width: 15rem; height: 12rem; }
    .card:hover { transform: scale(1.08); }
    .red { background: #d63b3b; }
    .blue { background: #1fd4e6; color: #052a2f; }
    .yellow { background: goldenrod; color: #2a1d00; }
    a { text-decoration: none; color: inherit; }

    /* Intro */
    .intro { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .35rem; padding: 0 1rem 1rem; }
    .intro h1 { margin: .25rem 0 0; font-size: clamp(1.75rem, 4vw, 2.5rem); }
    .intro p { max-width: 70ch; color: #e6f3f7; margin: 0; }

    /* Locations layout */
    .loc-grid { display: grid; grid-template-columns: 360px 1fr; gap: 1rem; align-items: stretch; padding: 1rem; }
    #map { width: 100%; min-height: 60vh; border-radius: 12px; overflow: hidden; transition: box-shadow 0.4s ease; }

    /* Pulse effect */
    .pulse {
      box-shadow: 0 0 0 4px #1fd4e6;
      animation: pulseBorder 1.5s ease-out;
    }
    @keyframes pulseBorder {
      0%   { box-shadow: 0 0 0 4px #1fd4e6; }
      50%  { box-shadow: 0 0 0 8px rgba(31, 212, 230, 0.5); }
      100% { box-shadow: 0 0 0 0 rgba(31, 212, 230, 0); }
    }

    .sidebar { background: #0f2730; border-radius: 12px; padding: 1rem; border: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; gap: .75rem; max-height: 70vh; overflow: auto; }
    .search { display: flex; gap: .5rem; }
    .search input { flex: 1; padding: .6rem .8rem; border-radius: .6rem; border: none; outline: none; }
    .search button { padding: .6rem .9rem; border-radius: .6rem; border: none; background: #1fd4e6; color: #052a2f; font-weight: 700; cursor: pointer; }
    .list { display: grid; gap: .6rem; }
    .card-item { background: #123845; border-radius: .8rem; padding: .75rem .9rem; transition: transform .15s ease, box-shadow .15s ease; cursor: pointer; }
    .card-item:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(0,0,0,.25); }
    .pill { display: inline-block; font-size: .75rem; padding: .15rem .5rem; border-radius: 999px; margin-top: .35rem; background: #1fd4e6; color: #052a2f; font-weight: 700; }

    @media (max-width: 860px) {
      .loc-grid { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
      #map { min-height: 45vh; }
    }
  </style>
</head>
<body>
  <!-- Hero + Navbar -->
  <header class="hero">
    <div class="hero__img-wrap">
      <img src="EventCenter1.png" alt="Events R’ Us banner"/>
    </div>
    <nav class="cards-container" aria-label="Primary">
      <a href="index.html"><div class="card-slot"><div class="card red"><h1>Home</h1></div></div></a>
      <a href="events.html"><div class="card-slot"><div class="card blue"><h1>Events</h1></div></div></a>
      <a href="menu.html"><div class="card-slot"><div class="card blue"><h1>Menu</h1></div></div></a>
      <a href="#locations" id="location-card"><div class="card-slot"><div class="card yellow"><h1>Location</h1></div></div></a>
      <a href="contactus.html"><div class="card-slot"><div class="card red"><h1>Contact Us</h1></div></div></a>
    </nav>
  </header>

  <!-- Intro -->
  <section class="intro">
    <h1>Find a Location</h1>
    <p>Tap a location to center the map and see details.</p>
  </section>

  <!-- Locations -->
  <section id="locations" aria-label="Locations and Map">
    <div class="loc-grid">
      <aside class="sidebar">
        <div class="search">
          <input id="q" type="search" placeholder="Search..." />
          <button id="clear">Clear</button>
        </div>
        <div id="list" class="list" role="list"></div>
      </aside>
      <div id="map"></div>
    </div>
  </section>

  <script>
    // API or demo data
    const API_URL = "/api/locations";
    const demoData = [
      { id: 1, name: "Events R’ Us — Main Hall", address: "244 Ponderosa Ave, Apple Valley, CA 92307", lat: 34.5382, lng: -117.2168, category: "Venue" },
      { id: 2, name: "Old Town Plaza", address: "77 Commerce Way, Apple Valley, CA 92307", lat: 34.5116, lng: -117.1853, category: "Plaza" }
    ];

    // Map init
    const map = L.map("map", { center: [34.5382, -117.2168], zoom: 11 });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

    const markersById = new Map();

    async function loadLocations() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error();
        return await res.json();
      } catch {
        return demoData;
      }
    }

    function renderList(locations) {
      const listEl = document.getElementById("list");
      listEl.innerHTML = "";
      locations.forEach(loc => {
        const btn = document.createElement("button");
        btn.className = "card-item";
        btn.innerHTML = `<h3>${loc.name}</h3><p>${loc.address}</p><span class="pill">${loc.category}</span>`;
        btn.onclick = () => focusLocation(loc.id);
        listEl.appendChild(btn);
      });
    }

    function renderMarkers(locations) {
      markersById.clear();
      const bounds = [];
      locations.forEach(loc => {
        const marker = L.marker([loc.lat, loc.lng]).addTo(map);
        marker.bindPopup(`<strong>${loc.name}</strong><br>${loc.address}`);
        markersById.set(loc.id, marker);
        bounds.push([loc.lat, loc.lng]);
      });
      if (bounds.length) map.fitBounds(bounds);
    }

    function focusLocation(id) {
      const marker = markersById.get(id);
      if (!marker) return;
      map.setView(marker.getLatLng(), 14, { animate: true });
      marker.openPopup();
      pulseMap();
    }

    function pulseMap() {
      const mapEl = document.getElementById("map");
      mapEl.classList.add("pulse");
      setTimeout(() => mapEl.classList.remove("pulse"), 1500);
    }

    // Navbar click effect
    document.getElementById("location-card").addEventListener("click", e => {
      e.preventDefault();
      document.getElementById("locations").scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(pulseMap, 800); // pulse after scroll
    });

    // Init
    loadLocations().then(data => {
      renderList(data);
      renderMarkers(data);
    });

    // Search
    document.getElementById("q").addEventListener("input", e => {
      const val = e.target.value.toLowerCase();
      loadLocations().then(data => {
        const filtered = data.filter(loc =>
          loc.name.toLowerCase().includes(val) ||
          loc.address.toLowerCase().includes(val) ||
          loc.category.toLowerCase().includes(val)
        );
        renderList(filtered);
        renderMarkers(filtered);
      });
    });

    document.getElementById("clear").addEventListener("click", () => {
      document.getElementById("q").value = "";
      loadLocations().then(data => {
        renderList(data);
        renderMarkers(data);
      });
    });
  </script>
</body>
</html>
